# Deploy to Joule Studio
# Trigger manually from GitHub UI: Actions > Deploy to Joule Studio > Run workflow
#
# Required repository variables (Settings > Secrets and variables > Actions > Variables):
#   SCI_TENANT_URL                 - Issuer URI of the SAP Cloud Identity Services tenant
#   SCI_CLIENT_ID                  - Client ID of the SCI application
#   SOLUTION_HANDLING_API_BASE_URL - Base URL of the Joule Studio solution handling API
#
# Setup:
#   1. This file is pushed automatically by Joule Studio when you push your solution
#   2. Set the required repository variables listed above
#   3. Complete the SCI tenant trust configuration described in GITHUB_SETUP.md

name: Deploy to Joule Studio

on:
  workflow_dispatch:  # manual trigger only

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Joule Studio CLI
        uses: ./.github/actions/setup-jl

      - name: Fetch SCI token
        id: fetch-token
        uses: ./.github/actions/token-fetch
        with:
          sciTenantUrl: ${{ vars.SCI_TENANT_URL }}
          sciClientId: ${{ vars.SCI_CLIENT_ID }}

      - name: Build solution
        id: build
        uses: ./.github/actions/build

      - name: Deploy solution
        uses: ./.github/actions/deploy
        with:
          sciToken: ${{ steps.fetch-token.outputs.sciToken }}
          solutionZip: ${{ steps.build.outputs.solutionZip }}
          jouleStudioUrl: ${{ vars.SOLUTION_HANDLING_API_BASE_URL }}
