apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: collection-email-agent
  version: "1.0.0"

type: agent

provides:
  apis:
    - name: collection-email-agent
      kind: a2a
      ordId: customer.build:apiResource:collection-email-agent-94c1e.collection-email-agent:v1

container:
  buildPath: .
  port: 5000

requires:
  - name: sap-s4-cadunning-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:collection-email-agent-94c1e.sap-s4-cadunning-mcp-server:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
